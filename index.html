:root{
  --accent:var(--color-action-theme-primary); --ink:var(--color-content-default); --ink-2:var(--color-content-subtle); --ink-3:var(--color-icon-subtle);
  --surface:var(--color-surface-default); --surface-2:var(--color-canvas-secondary); --soft:var(--color-surface-secondary);
  --line:var(--color-border-secondary); --line-soft:var(--color-border-tertiary); --line-strong:var(--color-border-default);
  --critical:var(--color-content-negative); --watch:var(--color-content-warning); --stable:var(--color-content-positive); --info:var(--color-content-info);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--surface-2);color:var(--ink);font-family:var(--font-family-sans-serif);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.r,.amt{font-variant-numeric:tabular-nums}
a{color:var(--primary-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#main:focus{outline:none}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px}
.logo{display:block;width:118px;height:28px;background:var(--logo) left center/contain no-repeat}
.brand small{display:block;margin-top:6px;font-size:12px;color:var(--ink-2)}

.persona{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.persona:hover{border-color:var(--line-strong)}
.persona select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.persona .who{min-width:0;flex:1}
.persona .who b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .who span{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .chev{color:var(--ink-3)}
.persona-cap{font-size:12px;color:var(--ink-3);padding:0 8px;margin:-12px 0 0}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none;background:var(--soft);color:var(--ink-2)}
.av.me{background:var(--color-surface-primary);color:var(--primary-ink)}
.av.sm{width:24px;height:24px;font-size:10px}
.av.xs{width:20px;height:20px;font-size:9px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--color-surface-primary);color:var(--primary-ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--primary-ink);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px;display:flex;flex-direction:column;gap:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-size:inherit}
.linkbtn:hover{color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.main{min-width:0;padding:32px 36px 96px;max-width:1280px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-content-primary);margin:0 0 6px}
.head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--ink-2)}
.crumb{all:unset;cursor:pointer;color:var(--ink-2);font-size:13px;margin-bottom:10px;display:inline-block}
.crumb:hover{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--elevation-sm);padding:20px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-title{margin:0;font-size:15px;font-weight:600}
.card-note{font-size:12.5px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.g75{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
.g75.wide{grid-template-columns:minmax(0,1fr) 340px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:background .15s}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--color-action-theme-primary);color:#fff}
.btn.pri:hover{background:var(--color-action-theme-primary-hover)}
.btn.sec{background:var(--surface);border-color:var(--line-strong)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--critical);border-color:var(--line-strong);background:var(--surface)}
.btn.danger:hover{background:var(--color-surface-negative-subtle)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

.kpi{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--elevation-sm);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.kpi:hover{border-color:var(--line-strong)}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.kpi.act .v{color:var(--color-content-primary)}
.kpi .s{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kpi.static{cursor:default}

.pill{display:inline-block;padding:2px 9px;border-radius:9999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--ink-2)}
.st-pending,.st-review{background:var(--color-surface-info-subtle);color:var(--info)}
.st-returned{background:var(--color-surface-warning-subtle);color:var(--watch)}
.st-rejected,.st-cancelled{background:var(--color-surface-negative-subtle);color:var(--critical)}
.st-approved,.st-signed,.st-paying{background:var(--color-surface-primary);color:var(--primary-ink)}
.st-in_batch{background:var(--color-surface-accent);color:var(--color-content-accent)}
.st-paid{background:var(--color-surface-positive-subtle);color:var(--stable)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tbody tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.code{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:12.5px}
.ttl{font-weight:500}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;padding:9px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .c{font-size:12px;color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13px}
.f .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.flabel{font-weight:500;font-size:13px}
.in{height:38px;border:1px solid var(--line-strong);border-radius:10px;background-color:var(--surface);padding:0 12px;width:100%;font-weight:400}
textarea.in{height:auto;min-height:76px;padding:9px 12px;resize:vertical}
select.in{padding-right:28px}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.err{border-color:var(--critical)}
.money{position:relative}
.money .in{padding-right:34px;text-align:right;font-variant-numeric:tabular-nums}
.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px;pointer-events:none}
.ferr{color:var(--critical);font-size:12.5px;font-weight:400}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.fgrid.three{grid-template-columns:repeat(3,1fr)}

.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice.two{grid-template-columns:1fr 1fr}
.choice label{border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-weight:500;font-size:13px}
.choice label span{font-weight:400;color:var(--ink-3);font-size:12px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){border-color:var(--accent);background:var(--color-surface-primary)}
.choice label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-weight:500;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--color-action-theme-primary);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* chuỗi duyệt */
.chain{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:11.5px;top:26px;bottom:2px;width:1px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line-strong);background:var(--surface);position:relative;z-index:1}
.step.current .dot{border-color:var(--info);color:var(--info);box-shadow:0 0 0 3px var(--color-surface-info-subtle)}
.step.approved .dot,.step.done .dot{background:var(--color-action-theme-primary);border-color:var(--color-action-theme-primary);color:#fff}
.step.rejected .dot{background:var(--critical);border-color:var(--critical);color:#fff}
.step.returned .dot{background:var(--watch);border-color:var(--watch);color:#fff}
.step .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.step .sh b{font-size:13.5px;font-weight:600}
.step .meta{font-size:12px;color:var(--ink-3)}
.ppl{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.person{display:flex;align-items:center;gap:8px;font-size:13px}
.person .nm{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.person .nm small{color:var(--ink-3);font-size:11.5px}
.person .dec{margin-left:auto;font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.person .dec.ok{color:var(--primary-ink)}
.person .dec.no{color:var(--critical)}
.person .dec.ret{color:var(--watch)}
.pnote{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--line-strong);padding:2px 0 2px 10px;margin:2px 0 0 28px}
.snote{font-size:12px;color:var(--ink-3);margin-top:4px}

.alert{border-radius:12px;padding:10px 14px;font-size:13px;border-left:3px solid var(--line-strong);background:var(--surface-2)}
.alert.neg{border-left-color:var(--critical);background:var(--color-surface-negative-subtle)}
.alert.warn{border-left-color:var(--watch);background:var(--color-surface-warning-subtle)}
.alert.ok{border-left-color:var(--color-action-theme-primary);background:var(--color-surface-primary)}
.alert.info{border-left-color:var(--info);background:var(--color-surface-info-subtle)}
.alert b{font-weight:600}
.alert ul{margin:4px 0 0;padding-left:18px}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px}
.kv span{display:block;font-size:12px;color:var(--ink-3)}
.kv b{font-weight:500;font-size:13.5px}
.amount-big{font-size:28px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}

.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-child{padding-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m{font-size:12.5px;color:var(--ink-3)}
.li .amt{font-weight:600;white-space:nowrap}
.li.click{cursor:pointer;border-radius:8px}
.li.click:hover .t{color:var(--primary-ink)}

ol.guide{margin:0;padding:0;list-style:none;counter-reset:g}
ol.guide li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
ol.guide li:last-child{border-bottom:0;padding-bottom:0}
ol.guide li::before{counter-increment:g;content:counter(g);width:20px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
ol.guide li.done::before{content:"✓";color:var(--color-content-primary)}
ol.guide li.done .gt b{color:var(--ink-2)}
ol.guide .gt{flex:1;min-width:0}
ol.guide .gt b{font-weight:500;display:block}
ol.guide .gt span{font-size:12.5px;color:var(--ink-3)}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9999px;padding:2px 4px 2px 3px;font-size:12.5px;background:var(--surface)}
.chip.file{padding:3px 10px;color:var(--ink-2)}
.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.chip button:hover{background:var(--color-surface-negative-subtle);color:var(--critical)}
.chip button:focus-visible{outline:2px solid var(--accent)}
.chip.warnc{border-color:var(--watch)}
.chip .lvn{font-size:11px;color:var(--ink-3)}
select.add{flex:none;width:auto;height:28px;border:1px dashed var(--line-strong);border-radius:9999px;background-color:transparent;padding:0 26px 0 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;max-width:220px}

/* cấu hình */
.band{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--elevation-sm)}
.band-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.band-h .range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500}
.band-h .range .money{width:150px}
.band-h .range .money .in{height:34px}
.band-h .bno{font-size:12px;color:var(--ink-3);font-weight:500}
.band-b{padding:4px 18px 10px}
.lvl{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.lvl:last-child{border-bottom:0}
.lvl-n b{display:block;font-size:13.5px;font-weight:500}
.lvl-n span{font-size:12px;color:var(--ink-3)}
.lvl-opts{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.lvl-opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.lvl-opts select{height:28px;border:1px solid var(--line-strong);border-radius:8px;background-color:var(--surface);padding:0 24px 0 8px;font-size:12.5px}
.lvl-opts input{accent-color:var(--accent)}
.savebar{position:sticky;bottom:16px;margin-top:20px;z-index:5;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--elevation-lg);flex-wrap:wrap}
.toggle{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0 12px}
.toggle input{width:16px;height:16px;margin-top:2px;accent-color:var(--accent)}
.toggle b{font-weight:500;display:block}
.toggle span{font-size:12.5px;color:var(--ink-3)}
.sect{padding-top:14px;margin-top:14px;border-top:1px solid var(--line-soft)}
.sect>b{font-weight:500;display:block}
.sect>.hint{font-size:12.5px;color:var(--ink-3);margin:2px 0 10px}

.fbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.fbar .in{height:34px}
.fdate{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-3)}
.fdate .in{height:34px;width:150px;color:var(--ink)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
table.lines td{padding:5px 4px}
table.lines td:first-child{padding-left:8px}
table.lines th{padding:8px 6px}
table.lines tfoot td{padding:10px 8px}
.cell{height:32px;padding:0 8px;border-radius:8px}
.cell.r{text-align:right;font-variant-numeric:tabular-nums}
select.cell{padding-right:18px}
.choice.four{grid-template-columns:repeat(4,1fr)}
.flist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.frow{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.frow .fname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:400;font-size:13px}
.frow select.in{width:190px;height:32px;flex:none}
.chip.file button:hover{background:var(--soft);color:var(--ink)}
.rule{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--elevation-sm)}
.rule.open{border-color:var(--line-strong)}
.rule-h{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 20px;gap:16px;align-items:start;padding:16px 18px;cursor:pointer;width:100%}
.rule-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:16px}
.rule-s{display:flex;flex-direction:column;gap:2px}
.rule-s b{font-weight:600;font-size:14px}
.rule-b{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-2)}
.rsum{display:grid;grid-template-columns:130px 1fr;gap:10px}
.rsum .rb{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.rsum b{font-weight:500;color:var(--ink-3)}
.rule .chev{color:var(--ink-3);margin-top:2px}
.rule-e{padding:4px 18px 18px;border-top:1px solid var(--line)}
.rule-e .band{box-shadow:none}
.rstep{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin:14px 0 10px}
.rstep i,.rstep-i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--color-surface-primary);color:var(--primary-ink);font-size:11.5px;font-weight:600}
.vsel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400}
.vsel b{font-weight:500}
.vlist{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.vlist button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line-soft);font-weight:400}
.vlist button:last-of-type{border-bottom:0}
.vlist button:hover,.vlist button:focus-visible{background:var(--color-surface-primary)}
.vlist button b{font-weight:500}
.vlist button span{font-size:12px;color:var(--ink-3)}
.cb{width:16px;height:16px;accent-color:var(--accent);margin:0}
.copy{all:unset;cursor:pointer;color:var(--ink-3);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;vertical-align:middle;margin-left:2px}
.copy:hover{background:var(--soft);color:var(--ink)}
.copy:focus-visible{outline:2px solid var(--accent)}
.copy svg{width:14px;height:14px}
.deleg,.li .m.deleg{color:var(--color-content-accent);font-size:12px}
.checks{display:flex;flex-direction:column;gap:2px}
.paid-mark{font-size:12.5px;color:var(--stable);white-space:nowrap}

.empty{text-align:center;padding:32px 16px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:14.5px;font-weight:500;margin-bottom:4px}

.modal-bg{position:fixed;inset:0;background:#00000059;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--elevation-lg);width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:18px 20px 0}
.modal-h h3{margin:0;font-size:16px;font-weight:600}
.modal-h p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.modal-b{padding:16px 20px;overflow:auto;min-height:0}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px dashed var(--line-strong);border-radius:12px;padding:18px;cursor:pointer;text-align:center;color:var(--ink-2);font-size:13px}
.drop:hover{border-color:var(--accent);color:var(--ink)}
.drop:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;box-shadow:var(--elevation-lg);z-index:60;font-size:13.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease}@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}}

@media (max-width:1100px){.g75.wide{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.choice.four{grid-template-columns:1fr 1fr}.g75{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.sticky{position:static!important}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:10px;z-index:20;border-right:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .brand small,.side-foot,.persona-cap{display:none}
  .persona{flex:1;min-width:180px;padding:6px 8px}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px}
  .nav button{padding:7px 10px;white-space:nowrap}
  .main{padding:20px 14px 88px}
  .fgrid,.fgrid.three,.kv,.g2{grid-template-columns:1fr}
  .choice.four{grid-template-columns:1fr 1fr}
  .choice{grid-template-columns:1fr}
  .lvl{grid-template-columns:1fr}
  .rule-h{grid-template-columns:1fr 20px}.rule-b{grid-column:1/-1;grid-row:2}
  .rsum{grid-template-columns:1fr}
}

.choice.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.choice.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.choice.five{grid-template-columns:1fr 1fr}}
.vdir th,.vdir td{padding:10px 8px}
.vdir td.act{white-space:nowrap;text-align:right}
.vdir td.act .btn{padding:0 8px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>
<div id="toast"></div>
<script type="module" src="/src/main.js"></script>
</body>
